services:
  - type: web
    name: gurugraph-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /health
    envVars:
      - key: LLM_PROVIDER
        value: gemini
      - key: DEMO_MODE
        value: live
      - key: GEMINI_API_KEYS
        sync: false
